spring.config.import=optional:file:./config/node.properties,optional:file:./config/download.properties

#admin endpoint ports
server.port=10000

#Set the path to the directory where all yaci-cli related files are stored including cardano-node binary.
#Default is the user_home/.yaci-cli
#yaci.cli.home=/Users/satya/yacicli

#Path to directory containing Plutus cost models JSON files (plutus-costmodels-v10.json, plutus-costmodels-v11.json)
yaci.cli.plutus-costmodels-path=./config

ogmios.enabled=false
kupo.enabled=false
yaci.store.enabled=false
yano.enabled=false

yaci.store.mode=native

bp.create.enabled=true

## Default ports
#ogmios.port=1337
#kupo.port=1442
#yaci.store.port=8080
#socat.port=3333
#prometheus.port=12798
#yano.server.port=14447
#yano.http.port=6060

## Spacing for Yano's past-time-travel backfill, the catch-up from the shifted genesis to wall clock.
## auto (default): Yano derives the spacing from genesis, placing only the blocks a Haskell relay needs
## to validate the history - gaps stay inside the forecast window (3k/f) and the epoch-boundary blocks
## required for nonces are kept. Create time then stops growing with epoch length.
## dense: one block per slot, Yano's own default. An integer forces the interval in slots.
#yano.backfill.block.interval.slots=auto


