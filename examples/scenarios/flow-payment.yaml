# TxFlow scenario: multi-step orchestration.
#
# TxFlow runs ordered steps with UTXO chaining, confirmation tracking and devnet-tuned
# rollback recovery. This minimal single-step flow exercises the flow executor; add more
# `steps:` with `depends_on:` to chain transactions (a later step can spend the outputs of
# an earlier one). Yaci DevKit runs flows with SEQUENTIAL chaining for reproducible state.
#
# Run it:
#   CLI : run-scenario --file examples/scenarios/flow-payment.yaml
#   REST: POST /local-cluster/api/scenarios/run   body: {"yaml": "<contents>"}
version: "1.0"
flow:
  id: demo-payment-flow
  description: Single-step payment flow
  steps:
    - step:
        id: pay
        tx:
          from: addr_test1qryvgass5dsrf2kxl3vgfz76uhp83kv5lagzcp29tcana68ca5aqa6swlq6llfamln09tal7n5kvt4275ckwedpt4v7q48uhex
          intents:
            - type: payment
              address: addr_test1qr9xuxclxgx4gw3y4h4tcz4yvfmrt3e5nd3elphhf00a67xnrv5vjcv6tzehj2nnjj4cth4ndzyuf4asvvkgzeac2hfqk0za93
              amounts:
                - unit: lovelace
                  quantity: 30000000
        context:
          signers:
            - ref: account://acc0
              scope: payment
