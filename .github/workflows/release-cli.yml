name: Build and Release Yaci CLI Zip

on:
  push:
    tags:
      - 'v*'
      - 'rel-cli-*'

jobs:
  buildAndPush:
    strategy:
      matrix:
        os: ["ubuntu-22.04", "macos-15"]
    runs-on: ${{ matrix.os }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      FORCE_COLOR: 1
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: '21.0.5'
          native-image-job-reports: 'true'
      - name: Get Tag from version file
        run: |
          TAG=$(grep "tag=" config/version | cut -d'=' -f2)
          echo "TAG=${TAG}" >> $GITHUB_ENV
      - name: Grant execute permission for gradlew
        working-directory: applications/cli
        run: chmod +x gradlew
      - name: Set OS prefix
        working-directory: applications/cli
        if: runner.os == 'Linux'
        run: |
            echo "os_prefix=linux" >> $GITHUB_ENV
      - name: MacOS specific env
        if: runner.os == 'macOS'
        run: |            
            echo "os_prefix=macos" >> $GITHUB_ENV
      - name: Build with Gradle
        working-directory: applications/cli
        run: ./gradlew --no-daemon -i -Pversion=${{ env.TAG }} clean build nativeCompile cliZip

      - name: Copy zip artifacts
        working-directory: applications/cli
        run: mv build/yaci-cli-${{ env.TAG }}.zip build/yaci-cli-${{ env.TAG }}-${{ env.os_prefix }}-${{ runner.arch }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yaci-cli-${{ matrix.os }}
          path: |
            applications/cli/build/native/nativeCompile/yaci-cli
            applications/cli/config
          retention-days: 2

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ./applications/cli/build/yaci-cli-${{ env.TAG }}-${{ env.os_prefix }}-${{ runner.arch }}.zip
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-publish:
    needs: buildAndPush
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        os: [ "ubuntu-22.04", "macos-15" ]
    runs-on: ${{ matrix.os }}
    env:
      FORCE_COLOR: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Get Tag from version file
        run: |
          TAG=$(grep "tag=" config/version | cut -d'=' -f2)
          echo "TAG=${TAG}" >> $GITHUB_ENV    

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: yaci-cli-${{ matrix.os }}

      - name: Determine Platform-Specific Folder
        id: platform-folder
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-22.04" ]]; then
            echo "npm_folder=yaci-devkit-linux-x64" >> $GITHUB_ENV
          elif [[ "${{ matrix.os }}" == "macos-15" ]]; then
            echo "npm_folder=yaci-devkit-macos-arm64" >> $GITHUB_ENV
          fi
          echo "npm_folder=${{ env.npm_folder }}"

      - name: Prepare npm package
        run: |
          cp build/native/nativeCompile/yaci-cli npm/${{ env.npm_folder }}/
          cp -r config npm/${{ env.npm_folder }}/

      - name: Set npm package version
        working-directory: npm/${{ env.npm_folder }}
        run: npm version ${{ env.TAG }} --no-git-tag-version

      - name: Publish to npm
        working-directory: npm/${{ env.npm_folder }}
        run: |
          if [[ "${{ env.TAG }}" == *"-preview"* ]]; then            
            npm publish --access public --tag preview
          elif [[ "${{ env.TAG }}" == *"-beta"* ]]; then            
            npm publish --access public --tag beta
          else            
            npm publish --access public
          fi                          

  publish-yaci-devkit:
    needs: npm-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Get Tag from version file
        run: |
          TAG=$(grep "tag=" config/version | cut -d'=' -f2)
          echo "TAG=${TAG}" >> $GITHUB_ENV    

      - name: Update `yaci-devkit` Version and Dependencies
        working-directory: npm/yaci-devkit
        run: |
          # Update the version
          npm version ${{ env.TAG }} --no-git-tag-version
          # Update platform-specific dependency versions
          sed -i "s/\"@bloxbean\/yaci-devkit-macos-arm64\": \".*\"/\"@bloxbean\/yaci-devkit-macos-arm64\": \"${{ env.TAG }}\"/" package.json
          sed -i "s/\"@bloxbean\/yaci-devkit-linux-x64\": \".*\"/\"@bloxbean\/yaci-devkit-linux-x64\": \"${{ env.TAG }}\"/" package.json

      - name: Publish `yaci-devkit` to npm
        working-directory: npm/yaci-devkit
        run: |
          if [[ "${{ env.TAG }}" == *"-preview"* ]]; then            
            npm publish --access public --tag preview
          elif [[ "${{ env.TAG }}" == *"-beta"* ]]; then            
            npm publish --access public --tag beta
          else            
            npm publish --access public
          fi

  # Publishes the formula to bloxbean/homebrew-tap, like the npm packages: a final release updates yaci-devkit,
  # a *-beta* release updates yaci-devkit-beta, a *-preview* release is not published. It downloads the zips the
  # buildAndPush jobs attached to this tag's release, so it runs only after both of them.
  update-homebrew:
    needs: buildAndPush
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Get Tag from version file
        run: |
          TAG=$(grep "tag=" config/version | cut -d'=' -f2)
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "FORMULA=$(.github/scripts/homebrew-formula.sh name "$TAG")" >> $GITHUB_ENV

      - name: Skip preview releases
        if: env.FORMULA == ''
        run: echo "${{ env.TAG }} is a preview release - the Homebrew formulas are not updated."

      - name: Download release zips
        if: env.FORMULA != ''
        run: |
          # The release is the git tag's (v* or rel-cli-*), which can differ from the version in config/version
          BASE="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          echo "MAC_URL=${BASE}/yaci-cli-${TAG}-macos-ARM64.zip" >> $GITHUB_ENV
          echo "LINUX_URL=${BASE}/yaci-cli-${TAG}-linux-X64.zip" >> $GITHUB_ENV
          curl -fSL -o macos.zip "${BASE}/yaci-cli-${TAG}-macos-ARM64.zip"
          curl -fSL -o linux.zip "${BASE}/yaci-cli-${TAG}-linux-X64.zip"
          echo "MAC_SHA=$(sha256sum macos.zip | cut -d' ' -f1)" >> $GITHUB_ENV
          echo "LINUX_SHA=$(sha256sum linux.zip | cut -d' ' -f1)" >> $GITHUB_ENV

      - name: Checkout homebrew-tap
        if: env.FORMULA != ''
        uses: actions/checkout@v4
        with:
          repository: bloxbean/homebrew-tap
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # The token is only needed for the push below, which passes it explicitly
          persist-credentials: false

      - name: Write formula
        if: env.FORMULA != ''
        run: |
          mkdir -p homebrew-tap/Formula
          .github/scripts/homebrew-formula.sh render "$FORMULA" "$TAG" "$MAC_URL" "$MAC_SHA" "$LINUX_URL" "$LINUX_SHA" \
            > "homebrew-tap/Formula/${FORMULA}.rb"
          ruby -c "homebrew-tap/Formula/${FORMULA}.rb"
          cat "homebrew-tap/Formula/${FORMULA}.rb"

      - name: Commit and push
        if: env.FORMULA != ''
        working-directory: homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Formula/${FORMULA}.rb"
          if git diff --cached --quiet; then
            echo "Formula ${FORMULA} already at ${TAG} - nothing to push."
            exit 0
          fi
          git commit -m "${FORMULA} ${TAG}"
          git remote set-url origin "https://x-access-token:${TAP_TOKEN}@github.com/bloxbean/homebrew-tap.git"
          git push
