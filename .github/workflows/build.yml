name: Clean, Build Native Image

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: earthly/actions-setup@v1
        with:
          version: v0.8.0
      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v1
        with:
          image: tonistiigi/binfmt:latest
          platforms: all
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          # Oracle GraalVM for JDK 21.0.5, as in release-cli.yml. Pinned through java-version: the action then downloads
          # it from download.oracle.com/graalvm/21/archive/. (`version:` only looks among the 10 newest GDS builds, so
          # an older pin stops resolving; unpinned Liberica broke when its 21.0.13 assets were named 21.0.13.0.3+6.)
          java-version: '21.0.5'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Get Tag from version file
        run: |
          TAG=$(grep "tag=" config/version | cut -d'=' -f2)
          echo "TAG=${TAG}" >> $GITHUB_ENV
      - name: Run build
        run: earthly +build --tag ${{ env.TAG }} --build_type=native-ci
